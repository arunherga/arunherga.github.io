name: Check private reports app

on:
  push:
    branches: [main]
    paths:
      - 'private-reports/**'
      - '.github/workflows/private-reports-checks.yml'
  pull_request:
    paths:
      - 'private-reports/**'
      - '.github/workflows/private-reports-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: private-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private-reports/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
